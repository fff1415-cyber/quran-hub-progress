name: Independent audit release checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: independent-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployment-package:
    if: github.head_ref == 'fix/release-25-backup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolated backup and deployment-baseline regressions (no SSH or production secrets)
        run: python3 tests/hostinger-backup-regression.py && python3 tests/api-release-regression.py && python3 tests/hostinger-release-base-regression.py
  client-and-sqlite:
    if: github.head_ref == 'fix/audit-independent-release-2' || github.head_ref == 'fix/audit-plan-safeguards' || startsWith(github.head_ref, 'fix/audit-safe-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --offline --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Client and offline archive regressions (no production configuration)
        run: |
          set -e
          failed=0
          for test in tests/*-regression.cjs tests/plan-server-confirmation.cjs; do node "$test" || failed=1; done
          exit "$failed"
      - name: Real PHP handlers with disposable SQLite fixtures
        run: |
          set -e
          find api tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/backend-independent-settings.php
          php tests/backend-independent-import.php
          php tests/backend-plan-safeguards.php
          php tests/backend-evaluation-reference.php
          php tests/backend-readonly-grade-context.php
          php tests/backend-targeted-writes.php
          php tests/backend-continuity.php
          php tests/backend-calendar-continuity.php
      - name: TypeScript regression against the exact published source
        if: github.head_ref == 'fix/audit-safe-preserve-current-work'
        run: python3 tests/type-baseline-regression.py
      - name: Actual Hostinger package build without deployment
        run: npm run build:hostinger
      - name: Isolated package and backup/verification fixtures (no SSH or production credentials)
        run: python3 tests/hostinger-backup-regression.py && python3 tests/api-release-regression.py && python3 tests/hostinger-release-base-regression.py && python3 tests/published-static-regression.py
      - name: Read the previously published marker and static entry files only
        env:
          EXPECTED_PUBLISHED_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/verify-published-static.py "$EXPECTED_PUBLISHED_SHA"
      - name: Build and verify compatible rollback without production calls
        if: github.head_ref == 'fix/audit-safe-score-records'
        run: python3 scripts/prepare-record-confirmation-rollback.py
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'fix/audit-safe-score-records'
        with:
          name: record-confirmation-compatible-rollback
          path: dist/record-confirmation-compatible-rollback/frontend.zip
          retention-days: 30
      - name: Build read-only refresh compatible rollback (no data restore)
        if: github.head_ref == 'fix/audit-safe-portal-refresh'
        run: python3 scripts/prepare-portal-refresh-rollback.py
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'fix/audit-safe-portal-refresh'
        with:
          name: portal-refresh-compatible-rollback
          path: dist/portal-refresh-compatible-rollback/
          retention-days: 30
      - name: Build compatible targeted writes rollback (no data restore)
        if: github.head_ref == 'fix/audit-safe-targeted-writes'
        run: python3 scripts/prepare-targeted-writes-rollback.py
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'fix/audit-safe-targeted-writes'
        with:
          name: targeted-writes-compatible-rollback
          path: dist/targeted-writes-compatible-rollback/
          retention-days: 30
      - name: Build compatible local-transfer rollback (no data restore)
        if: github.head_ref == 'fix/audit-safe-local-transfers'
        run: python3 scripts/prepare-local-transfers-rollback.py
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'fix/audit-safe-local-transfers'
        with:
          name: local-transfers-compatible-rollback
          path: dist/local-transfers-compatible-rollback/
          retention-days: 30
      - name: Build no-reset compatible rollback without data restoration
        if: github.head_ref == 'fix/audit-safe-preserve-current-work'
        run: python3 scripts/prepare-continuity-rollback.py
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'fix/audit-safe-preserve-current-work'
        with:
          name: continuity-compatible-rollback
          path: dist/continuity-compatible-rollback/
          retention-days: 30
  database-concurrency:
    if: github.head_ref == 'fix/audit-independent-release-2' || github.head_ref == 'fix/audit-plan-safeguards' || startsWith(github.head_ref, 'fix/audit-safe-')
    name: Isolated transactions (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: MySQL 8
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1
          - engine: MariaDB 11.8
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: audit_test
          MYSQL_USER: audit
          MYSQL_PASSWORD: audit_only
          MYSQL_ROOT_PASSWORD: isolated_root_only
        ports: [3307:3306]
        options: --health-cmd="${{ matrix.health }}" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Real row-lock contention and partial-failure rollback
        env:
          AUDIT_MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=audit_test;charset=utf8mb4
        run: php tests/backend-independent-mysql.php
