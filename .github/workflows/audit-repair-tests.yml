name: Audit repair isolated tests
on:
  push:
    branches: [fix/audit-f03-f22-preserve-history]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mysql-integrity:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: audit_test
          MYSQL_USER: audit
          MYSQL_PASSWORD: audit_only
          MYSQL_ROOT_PASSWORD: isolated_root_only
        ports: [3307:3306]
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Isolated MySQL migration and real row-lock contention
        env:
          AUDIT_MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=audit_test;charset=utf8mb4
        run: php tests/backend-mysql-integrity.php
  isolated-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Existing runner PHP (no system package updates)
        run: php --version && php -m
      - name: PHP syntax and isolated SQLite handlers
        run: |
          find api tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/backend-sard-regression.php
          if [ -f tests/backend-plan-integrity.php ]; then php tests/backend-plan-integrity.php; fi
          if [ -f tests/backend-state-integrity.php ]; then php tests/backend-state-integrity.php; fi
          if [ -f tests/backend-diary-integrity.php ]; then php tests/backend-diary-integrity.php; fi
          if [ -f tests/backend-progression-integrity.php ]; then php tests/backend-progression-integrity.php; fi
      - name: Existing locked project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Client regressions
        run: |
          for test in tests/*regression.cjs tests/plan-server-confirmation.cjs; do node "$test"; done
