name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SSH_PORT: "65002"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "$1" ]; then
              echo "::error::Secret $2 is missing in GitHub Settings → Secrets"
              missing=1
            fi
          }
          check "${{ secrets.FTP_SERVER }}" "FTP_SERVER"
          check "${{ secrets.FTP_USERNAME }}" "FTP_USERNAME"
          check "${{ secrets.FTP_PASSWORD }}" "FTP_PASSWORD"
          check "${{ secrets.FTP_SERVER_DIR }}" "FTP_SERVER_DIR"
          check "${{ secrets.FTP_API_DIR }}" "FTP_API_DIR"
          if [ "$missing" -ne 0 ]; then exit 1; fi
          host="${{ secrets.FTP_SERVER }}"
          if echo "$host" | grep -qE '[A-Za-z]'; then
            echo "::warning::FTP_SERVER='$host' looks like a domain name. Hostinger requires the **server IP** from hPanel → Advanced → SSH Access (e.g. 93.x.x.x)."
          fi
          echo "All required secrets are present."

      - name: Resolve Hostinger paths
        id: paths
        run: |
          set -euo pipefail
          user="${{ secrets.FTP_USERNAME }}"
          user="${user%%@*}"
          front="${{ secrets.FTP_SERVER_DIR }}"
          api="${{ secrets.FTP_API_DIR }}"
          # Ensure leading slash for path join
          [[ "$front" == /* ]] || front="/${front}"
          [[ "$api" == /* ]] || api="/${api}"
          if [[ "$front" != /home/* ]]; then
            front="/home/${user}${front}"
          fi
          if [[ "$api" != /home/* ]]; then
            api="/home/${user}${api}"
          fi
          echo "frontend=$front" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "ssh_user=$user" >> "$GITHUB_OUTPUT"
          echo "m1_frontend=/home/${user}/domains/m1.msht.io/public_html/" >> "$GITHUB_OUTPUT"
          echo "m1_api=/home/${user}/domains/m1.msht.io/public_html/api/" >> "$GITHUB_OUTPUT"
          echo "m2_frontend=/home/${user}/domains/m2.msht.io/public_html/" >> "$GITHUB_OUTPUT"
          echo "m2_api=/home/${user}/domains/m2.msht.io/public_html/api/" >> "$GITHUB_OUTPUT"
          echo "Frontend path: $front"
          echo "API path: $api"
          echo "SSH user: $user"
          echo "m1 frontend: /home/${user}/domains/m1.msht.io/public_html/"

      - name: Test server connectivity
        run: |
          set +e
          host="${{ secrets.FTP_SERVER }}"
          echo "Checking deploy ports on $host ..."
          sftp_ok=0
          ftps_ok=0
          if nc -z -w 20 "$host" "${SSH_PORT}"; then
            echo "Port ${SSH_PORT} (SFTP) is reachable."
            sftp_ok=1
          else
            echo "::warning::Port ${SSH_PORT} not reachable — SFTP will likely fail. Use FTP_SERVER = IP from hPanel → SSH Access."
          fi
          if nc -z -w 20 "$host" 21; then
            echo "Port 21 (FTPS) is reachable."
            ftps_ok=1
          else
            echo "::warning::Port 21 not reachable from GitHub — FTPS fallback may fail (common on Hostinger)."
          fi
          if [ "$sftp_ok" -eq 0 ] && [ "$ftps_ok" -eq 0 ]; then
            echo "::error::Neither port 65002 nor 21 reachable. Fix FTP_SERVER (must be server IP, not msht.io) and enable SSH Access in hPanel."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build:hostinger

      - name: Write deploy marker
        run: echo "${{ github.sha }}" > dist/client/deploy-sha.txt

      # Hostinger: SFTP on port 65002 is more reliable than FTPS from GitHub Actions
      - name: Sync frontend (SFTP primary)
        id: sftp_frontend
        continue-on-error: true
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ steps.paths.outputs.ssh_user }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          local_path: ./dist/client/
          remote_path: ${{ steps.paths.outputs.frontend }}
          sftp_only: true
          sftpArgs: "-o ConnectTimeout=90 -o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          rsyncArgs: "--delete"

      - name: Sync frontend (FTPS fallback)
        if: steps.sftp_frontend.outcome == 'failure'
        id: ftps_frontend
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 300000
          local-dir: ./dist/client/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-frontend-v4-state.json

      - name: Ensure frontend deployed
        if: always() && steps.sftp_frontend.outcome == 'failure' && (steps.ftps_frontend.outcome == 'failure' || steps.ftps_frontend.outcome == 'skipped')
        run: |
          echo "Deploy results: SFTP=${{ steps.sftp_frontend.outcome }}, FTPS=${{ steps.ftps_frontend.outcome || 'skipped' }}"
          echo "::error::Frontend deploy failed. Check GitHub Secrets:"
          echo "  FTP_SERVER = server IP from hPanel → SSH Access (NOT msht.io)"
          echo "  FTP_USERNAME = SSH username (e.g. u112851217)"
          echo "  FTP_PASSWORD = main Hostinger account password"
          echo "  FTP_SERVER_DIR = /domains/msht.io/public_html/"
          echo "Enable SSH Access in hPanel → Advanced → SSH Access."
          exit 1

      - name: Sync PHP API (SFTP primary)
        id: sftp_api
        continue-on-error: true
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ steps.paths.outputs.ssh_user }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          local_path: ./api/
          remote_path: ${{ steps.paths.outputs.api }}
          sftp_only: true
          sftpArgs: "-o ConnectTimeout=90 -o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          rsyncArgs: "--exclude=config.php"

      - name: Sync PHP API (FTPS fallback)
        if: steps.sftp_api.outcome == 'failure'
        id: ftps_api
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 300000
          local-dir: ./api/
          server-dir: ${{ secrets.FTP_API_DIR }}
          state-name: .ftp-deploy-api-v4-state.json
          exclude: |
            **/config.php

      - name: Ensure API deployed
        if: always() && steps.sftp_api.outcome == 'failure' && (steps.ftps_api.outcome == 'failure' || steps.ftps_api.outcome == 'skipped')
        run: |
          echo "API deploy results: SFTP=${{ steps.sftp_api.outcome }}, FTPS=${{ steps.ftps_api.outcome || 'skipped' }}"
          echo "::error::API deploy failed. Same FTP secrets as frontend — see Ensure frontend deployed step."
          exit 1

      # Subdomains: sync same dist/client as main site (identical bundle; avoids empty m1 pack)
      # Skip when HOSTINGER_UNIFIED_SUBDOMAINS=true (m1/m2 docroot = msht.io/public_html in hPanel)
      - name: Sync m1 subdomain frontend (SFTP)
        id: sftp_m1_frontend
        continue-on-error: true
        if: (steps.sftp_frontend.outcome == 'success' || steps.ftps_frontend.outcome == 'success') && vars.HOSTINGER_UNIFIED_SUBDOMAINS != 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ steps.paths.outputs.ssh_user }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          local_path: ./dist/client/
          remote_path: ${{ steps.paths.outputs.m1_frontend }}
          sftp_only: true
          sftpArgs: "-o ConnectTimeout=90 -o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          rsyncArgs: "--delete"

      - name: Sync m1 subdomain API (SFTP)
        id: sftp_m1_api
        continue-on-error: true
        if: (steps.sftp_api.outcome == 'success' || steps.ftps_api.outcome == 'success') && vars.HOSTINGER_UNIFIED_SUBDOMAINS != 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ steps.paths.outputs.ssh_user }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          local_path: ./api/
          remote_path: ${{ steps.paths.outputs.m1_api }}
          sftp_only: true
          sftpArgs: "-o ConnectTimeout=90 -o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          rsyncArgs: "--exclude=config.php"

      - name: Remove default.php on m1 (SSH)
        id: m1_remove_default
        continue-on-error: true
        if: (steps.sftp_m1_frontend.outcome == 'success') && vars.HOSTINGER_UNIFIED_SUBDOMAINS != 'true'
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass >/dev/null
          bash scripts/post-deploy-hostinger-subdomains.sh \
            "${{ steps.paths.outputs.ssh_user }}" \
            "${{ secrets.FTP_SERVER }}"

      - name: Sync m2 subdomain frontend (SFTP)
        id: sftp_m2_frontend
        continue-on-error: true
        if: (steps.sftp_frontend.outcome == 'success' || steps.ftps_frontend.outcome == 'success') && vars.HOSTINGER_UNIFIED_SUBDOMAINS != 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ steps.paths.outputs.ssh_user }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          local_path: ./dist/client/
          remote_path: ${{ steps.paths.outputs.m2_frontend }}
          sftp_only: true
          sftpArgs: "-o ConnectTimeout=90 -o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          rsyncArgs: "--delete"

      - name: Sync m2 subdomain API (SFTP)
        id: sftp_m2_api
        continue-on-error: true
        if: (steps.sftp_api.outcome == 'success' || steps.ftps_api.outcome == 'success') && vars.HOSTINGER_UNIFIED_SUBDOMAINS != 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ steps.paths.outputs.ssh_user }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          local_path: ./api/
          remote_path: ${{ steps.paths.outputs.m2_api }}
          sftp_only: true
          sftpArgs: "-o ConnectTimeout=90 -o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          rsyncArgs: "--exclude=config.php"

      - name: Ensure m1 subdomain deployed
        if: always() && vars.HOSTINGER_UNIFIED_SUBDOMAINS != 'true' && (steps.sftp_frontend.outcome == 'success' || steps.ftps_frontend.outcome == 'success')
        run: |
          echo "m1 frontend: ${{ steps.sftp_m1_frontend.outcome || 'skipped' }}"
          echo "m1 api: ${{ steps.sftp_m1_api.outcome || 'skipped' }}"
          echo "m2 frontend: ${{ steps.sftp_m2_frontend.outcome || 'skipped' }}"
          echo "m2 api: ${{ steps.sftp_m2_api.outcome || 'skipped' }}"
          if [ "${{ steps.sftp_m1_frontend.outcome }}" = "failure" ] || [ "${{ steps.sftp_m1_api.outcome }}" = "failure" ]; then
            echo "::error::m1.msht.io deploy failed."
            echo "Fix (recommended): hPanel → Subdomains → m1 → Document root = /home/USER/domains/msht.io/public_html/"
            echo "Then set repo variable HOSTINGER_UNIFIED_SUBDOMAINS=true and re-run deploy."
            echo "Or fix SFTP path /home/USER/domains/m1.msht.io/public_html/ and delete default.php"
            exit 1
          fi
          if [ "${{ steps.sftp_m1_frontend.outcome }}" = "skipped" ]; then
            echo "::warning::m1 sync skipped — set HOSTINGER_UNIFIED_SUBDOMAINS if m1 uses main public_html"
          fi

      - name: Subdomain deploy summary
        if: always()
        continue-on-error: true
        run: |
          echo "m1 frontend: ${{ steps.sftp_m1_frontend.outcome || 'skipped' }}"
          echo "m1 api: ${{ steps.sftp_m1_api.outcome || 'skipped' }}"
          echo "m1 default.php removed: ${{ steps.m1_remove_default.outcome || 'skipped' }}"
          echo "m2 frontend: ${{ steps.sftp_m2_frontend.outcome || 'skipped' }}"
          echo "m2 api: ${{ steps.sftp_m2_api.outcome || 'skipped' }}"
          if [ "${{ vars.HOSTINGER_UNIFIED_SUBDOMAINS }}" = "true" ]; then
            echo "HOSTINGER_UNIFIED_SUBDOMAINS=true — m1/m2 served from main public_html (ensure hPanel docroot matches)"
          fi

      - name: Verify live deploy
        if: steps.sftp_frontend.outcome == 'success' || steps.ftps_frontend.outcome == 'success'
        continue-on-error: true
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          EXPECTED="${{ github.sha }}"
          SERVER_IP="${{ secrets.FTP_SERVER }}"
          UNIFIED="${{ vars.HOSTINGER_UNIFIED_SUBDOMAINS }}"
          CURL_EXTRA=()
          if echo "$SERVER_IP" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            CURL_EXTRA=(--resolve "msht.io:443:${SERVER_IP}" --resolve "m1.msht.io:443:${SERVER_IP}" --resolve "m2.msht.io:443:${SERVER_IP}")
            echo "Using --resolve for msht.io / m1 / m2 → ${SERVER_IP}"
          fi
          verify_host() {
            local host="$1"
            local label="$2"
            local sha
            sha=$(curl -fsS "${CURL_EXTRA[@]}" "https://${host}/deploy-sha.txt" 2>/dev/null)
            if [ "$sha" = "$EXPECTED" ]; then
              echo "Deploy verified on ${label} (commit ${EXPECTED:0:7})"
              return 0
            fi
            echo "::warning::${label}/deploy-sha.txt='${sha:-<empty>}' (expected ${EXPECTED:0:7}…)"
            return 1
          }
          for i in 1 2 3 4 5 6; do
            if verify_host "msht.io" "msht.io"; then
              M1_OK=0
              M2_OK=0
              if [ "$UNIFIED" = "true" ]; then
                echo "HOSTINGER_UNIFIED_SUBDOMAINS — m1/m2 should match main site if docroot is shared"
                verify_host "m1.msht.io" "m1.msht.io" && M1_OK=1
              else
                verify_host "m1.msht.io" "m1.msht.io" && M1_OK=1
                verify_host "m2.msht.io" "m2.msht.io" && M2_OK=1
              fi
              if [ "$M1_OK" -eq 0 ]; then
                echo "::error::m1.msht.io not serving latest deploy — see DEPLOY.md § Subdomains (document root or re-upload)"
                exit 1
              fi
              exit 0
            fi
            echo "Attempt $i: msht.io not ready yet, waiting…"
            sleep 15
          done
          echo "::warning::HTTPS verify skipped — upload succeeded but msht.io was not reachable from GitHub Actions."
          echo "Check manually: https://msht.io/deploy-sha.txt and https://m1.msht.io/deploy-sha.txt"
          exit 0
