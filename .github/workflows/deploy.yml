name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Write deploy marker
        run: echo "${{ github.sha }}" > dist/client/deploy-sha.txt

      - name: Sync frontend to Hostinger (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          local_path: ./dist/client/
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          sftp_only: true
          sftpArgs: -o ConnectTimeout=60 -o StrictHostKeyChecking=no
          rsyncArgs: --delete

      - name: Sync PHP API to Hostinger (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          local_path: ./api/
          remote_path: ${{ secrets.FTP_API_DIR }}
          sftp_only: true
          sftpArgs: -o ConnectTimeout=60 -o StrictHostKeyChecking=no
          rsyncArgs: --exclude=config.php

      - name: Verify live deploy
        run: |
          for i in 1 2 3 4 5 6; do
            LIVE=$(curl -fsS "https://msht.io/deploy-sha.txt" || true)
            if [ "$LIVE" = "${{ github.sha }}" ]; then
              echo "Deploy verified on msht.io"
              exit 0
            fi
            echo "Attempt $i: deploy-sha.txt='$LIVE'"
            sleep 15
          done
          echo "Deploy did not reach msht.io. Check FTP_SERVER (use server IP), FTP_SERVER_DIR, and SSH access in hPanel."
          exit 1
