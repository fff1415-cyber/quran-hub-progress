name: Bounded hosting access provenance
on:
  pull_request:
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'fix/stability-hosting-access-probe' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read only explicit test-config candidates and target vhost provenance
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/inspect-safety-provenance.py
