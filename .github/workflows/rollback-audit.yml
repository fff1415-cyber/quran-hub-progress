name: Preserve current site for rollback audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preserve:
    if: github.head_ref == 'audit/rollback-preservation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: hostinger-independent-test-restoration
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
      DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
      DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
      DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      EXPECTED_RELEASE: 2fb035f9932de580bf42af9557d38c46fdb0c862
      AUDIT_MODE: preserve-before-percentage-fix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact deployed code and inspect production aggregates read only
        if: env.AUDIT_MODE != 'compatibility-only'
        run: python3 scripts/rollback-audit.py
      - name: Create and verify the private production database archive
        if: env.AUDIT_MODE != 'compatibility-only'
        run: python3 scripts/create-private-db-backup.py
      - name: Restore the private archive only to the separate test database and verify hashes
        if: env.AUDIT_MODE != 'compatibility-only'
        run: python3 scripts/restore-hostinger-test.py
      - name: Test pinned legacy handlers against the fresh restored copy
        run: python3 scripts/rollback-compat-probe.py
      - name: Verify protected handlers with the same isolated restore
        env:
          QHP_SAFE_LEGACY_CANDIDATE: '1'
        run: |
          git worktree add --detach candidate 7e9adf1d4059f20289f182e31613e18fe2cf0877
          cat scripts/safe-legacy-patch-*.b64 | base64 --decode | gzip -dc > "$RUNNER_TEMP/safe-legacy.patch"
          git -C candidate apply --index "$RUNNER_TEMP/safe-legacy.patch"
          test "$(git -C candidate write-tree)" = "$(cat scripts/safe-legacy-tree.txt)"
          python3 scripts/rollback-compat-probe.py
