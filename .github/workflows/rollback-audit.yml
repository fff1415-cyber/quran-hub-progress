name: Preserve current site for rollback audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preserve:
    if: github.head_ref == 'audit/rollback-preservation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: hostinger-independent-test-restoration
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
      DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
      DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
      DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      EXPECTED_RELEASE: 4e8cfc813651d36f49a3c1ed5ddb9561a5442eab
      HAMMAM_RECOVERY_AUDIT: '1'
      HAMMAM_FRESH_BACKUP: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Create a fresh private production backup
        if: env.HAMMAM_FRESH_BACKUP == '1'
        run: python3 scripts/create-private-db-backup.py
      - name: Restore and verify the archive only in the independent test database
        if: env.HAMMAM_FRESH_BACKUP == '1'
        run: python3 scripts/restore-hostinger-test.py
      - name: Trace the grading history with production reads only
        if: env.HAMMAM_RECOVERY_AUDIT == '1'
        run: python3 scripts/hammam-recovery-audit.py
