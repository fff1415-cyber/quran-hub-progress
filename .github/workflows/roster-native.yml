name: Roster batch acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/roster-native.yml
      - api/routes/students.php
      - api/routes/halaqat.php
      - database/schema.sql
      - tests/stage6-batch.php
permissions:
  contents: read
jobs:
  mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_DATABASE: roster_test
          MYSQL_USER: roster
          MYSQL_PASSWORD: roster_fixture
          MYSQL_ROOT_PASSWORD: isolated_fixture_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixture rollback, retries and two isolated connections
        run: php tests/stage6-batch.php --native
