name: Verify old Qalaid with protected saves
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.head_ref == 'audit/rollback-preservation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Reconstruct the exact candidate from the approved old code
        run: |
          git worktree add --detach candidate 7e9adf1d4059f20289f182e31613e18fe2cf0877
          cat scripts/safe-legacy-patch-*.b64 | base64 --decode | gzip -dc > "$RUNNER_TEMP/safe-legacy.patch"
          git -C candidate apply --index "$RUNNER_TEMP/safe-legacy.patch"
          test "$(git -C candidate write-tree)" = "$(cat scripts/safe-legacy-tree.txt)"
      - name: Build and test the candidate without production access
        working-directory: candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          npm run build:hostinger
          asset=(dist/client/assets/TeacherHalaqaProgramsPanel-*.js)
          test "${#asset[@]}" -eq 1
          test -f "${asset[0]}"
          ! rg -q 'تعذّر تحديث درجات البرنامج العلمي من الخادم|درجات البرامج المحفوظة على هذا الجهاز من الإصدار السابق' "${asset[0]}"
          rg -q 'إعادة محاولة الحفظ' "${asset[0]}"
      - name: Publish only the tested program panel change
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BASE_RELEASE: 46f7f0a02cc63f0915f5cb7f7112d0a70ee7fb8d
          TARGET_RELEASE: 5d3998e74f1f705ae05838d7bbb6a3db3266374a
        run: |
          git fetch --no-tags origin release/hide-program-history-notices
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_RELEASE"
          test "$(git diff --name-only "$BASE_RELEASE" "$TARGET_RELEASE")" = 'src/components/TeacherHalaqaProgramsPanel.tsx'
          python3 scripts/protected-rollback-release.py publish "$BASE_RELEASE" "$TARGET_RELEASE"
