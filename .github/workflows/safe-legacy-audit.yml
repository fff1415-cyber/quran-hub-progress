name: Verify old Qalaid with protected saves
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safari:
    if: github.head_ref == 'audit/rollback-preservation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise the outbox with Safari storage quota
        run: |
          git worktree add --detach candidate 7e9adf1d4059f20289f182e31613e18fe2cf0877
          cat scripts/safe-legacy-patch-*.b64 | base64 --decode | gzip -dc > "$RUNNER_TEMP/safe-legacy.patch"
          git -C candidate apply --index "$RUNNER_TEMP/safe-legacy.patch"
          test "$(git -C candidate write-tree)" = "$(cat scripts/safe-legacy-tree.txt)"
          sudo safaridriver --enable
          cd candidate
          npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          node tests/grade-outbox-safari.cjs
  acceptance:
    needs: safari
    if: github.head_ref == 'audit/rollback-preservation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Reconstruct the exact candidate from the approved old code
        run: |
          git worktree add --detach candidate 7e9adf1d4059f20289f182e31613e18fe2cf0877
          cat scripts/safe-legacy-patch-*.b64 | base64 --decode | gzip -dc > "$RUNNER_TEMP/safe-legacy.patch"
          git -C candidate apply --index "$RUNNER_TEMP/safe-legacy.patch"
          test "$(git -C candidate write-tree)" = "$(cat scripts/safe-legacy-tree.txt)"
      - name: Build and test the candidate without production access
        working-directory: candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          node tests/stage2-atomic-local.cjs
          node tests/stage2-atomic-sessions.cjs
          php tests/stage3-atomic-plan.php
          npm run build:hostinger
      - name: Preserve a fresh private database backup without writing to production data
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/create-private-db-backup.py
      - name: Publish the exact browser-only storage fix with code fallback
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BASE_RELEASE: 5d3998e74f1f705ae05838d7bbb6a3db3266374a
          TARGET_RELEASE: 4eb275ef00092ea07cd15f0983c6b256efdeaac8
        run: |
          git fetch --no-tags origin release/grade-outbox-quota
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_RELEASE"
          test -z "$(git diff --name-only "$BASE_RELEASE" "$TARGET_RELEASE" -- api/ public/ .env.hostinger)"
          python3 scripts/protected-rollback-release.py publish "$BASE_RELEASE" "$TARGET_RELEASE"
