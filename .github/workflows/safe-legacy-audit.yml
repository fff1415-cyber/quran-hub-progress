name: Verify old Qalaid with protected saves
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.head_ref == 'audit/rollback-preservation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Reconstruct the exact candidate from the approved old code
        run: |
          git worktree add --detach candidate 7e9adf1d4059f20289f182e31613e18fe2cf0877
          cat scripts/safe-legacy-patch-*.b64 | base64 --decode | gzip -dc > "$RUNNER_TEMP/safe-legacy.patch"
          git -C candidate apply --index "$RUNNER_TEMP/safe-legacy.patch"
          test "$(git -C candidate write-tree)" = "$(cat scripts/safe-legacy-tree.txt)"
      - name: Build and test the candidate without production access
        working-directory: candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          node tests/stage2-atomic-local.cjs
          node tests/stage2-atomic-sessions.cjs
          node tests/tarbawi-local.cjs
          node ../scripts/test-scientific-program.cjs
          php tests/stage3-atomic-plan.php
          php tests/backend-sard-regression.php
          node tests/plan-server-confirmation.cjs
          node tests/grade-percentages-calendar.cjs
          npm run build:hostinger
      - name: Rehearse exact code rollback on disposable files
        run: bash scripts/verify-percentage-code-rollback.sh 2fb035f9932de580bf42af9557d38c46fdb0c862 4e73a7fae8ade96567c00dd7874188ee7d7886af
      - name: Test the fresh isolated restore and compare its holiday calculation
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          QHP_SAFE_LEGACY_CANDIDATE: '1'
          QHP_PERCENTAGE_SAMPLE: '1'
        run: |
          python3 scripts/rollback-compat-probe.py > "$RUNNER_TEMP/percentage-restore.txt"
          grep -v '^PERCENTAGE_SAMPLE ' "$RUNNER_TEMP/percentage-restore.txt"
          node scripts/assert-restored-percentages.cjs "$RUNNER_TEMP/percentage-restore.txt"
      - name: Publish and verify only the percentages frontend
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          git fetch --no-tags origin +refs/heads/release/calendar-grade-percentages:refs/remotes/origin/release/calendar-grade-percentages
          git diff --exit-code 2fb035f9932de580bf42af9557d38c46fdb0c862 4e73a7fae8ade96567c00dd7874188ee7d7886af -- api/ database/ public/ .env.hostinger
          python3 scripts/protected-rollback-release.py publish 2fb035f9932de580bf42af9557d38c46fdb0c862 4e73a7fae8ade96567c00dd7874188ee7d7886af
