name: Verify old Qalaid with protected saves
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.head_ref == 'audit/rollback-preservation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Reconstruct the exact candidate from the approved old code
        run: |
          git worktree add --detach candidate 7e9adf1d4059f20289f182e31613e18fe2cf0877
          cat scripts/safe-legacy-patch-*.b64 | base64 --decode | gzip -dc > "$RUNNER_TEMP/safe-legacy.patch"
          git -C candidate apply --index "$RUNNER_TEMP/safe-legacy.patch"
          test "$(git -C candidate write-tree)" = "$(cat scripts/safe-legacy-tree.txt)"
      - name: Build and test the candidate without production access
        working-directory: candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          node tests/stage2-atomic-sessions.cjs
          php tests/stage3-atomic-plan.php
          php tests/backend-sard-regression.php
          npm run build:hostinger
      - name: Create and verify a fresh isolated restore before changing the index
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          EXPECTED_RELEASE: 4eb275ef00092ea07cd15f0983c6b256efdeaac8
          COMPLETION_INDEX_MODE: test
        run: |
          test "$(curl -fsS --max-time 20 https://msht.io/deploy-sha.txt)" = "$EXPECTED_RELEASE"
          python3 scripts/create-private-db-backup.py
          python3 scripts/restore-hostinger-test.py
          python3 scripts/plan-completion-index.py
      - name: Publish the code compatible with both completion indexes
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BASE_RELEASE: 4eb275ef00092ea07cd15f0983c6b256efdeaac8
          TARGET_RELEASE: 40f5285634343fa09d610ab92a698d0cc7c29ec1
        run: |
          git fetch --no-tags origin release/assignment-scoped-plan-completions
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_RELEASE"
          python3 scripts/protected-rollback-release.py publish "$BASE_RELEASE" "$TARGET_RELEASE"
      - name: Apply the verified completion index and confirm live schema health
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          EXPECTED_RELEASE: 40f5285634343fa09d610ab92a698d0cc7c29ec1
          COMPLETION_INDEX_MODE: production
        run: |
          python3 scripts/plan-completion-index.py
          curl -fsS --max-time 20 "https://msht.io/api/r.php?path=%2Fhealth&verify=$(date +%s)" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["checks"]["schema_ready"] and d["checks"]["grade_protocol"]=="atomic"; print("LIVE_OK schema and atomic grade saves")'
