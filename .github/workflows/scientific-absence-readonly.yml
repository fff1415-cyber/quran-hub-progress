name: Read-only scientific grades and absence diagnosis
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'audit/scientific-absence-readonly' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read aggregate preparation and scientific records without any writers
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/scientific-absence-readonly.py
