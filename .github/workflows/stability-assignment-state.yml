name: Assignment state acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  client-sqlite:
    if: github.head_ref == 'fix/stability-assignment-state'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - run: php tests/assignment-state.php && php tests/backend-plan-safeguards.php
      - run: node tests/assignment-state-sessions.cjs && node tests/transition-recovery-sessions.cjs
      - run: node tests/assignment-panel-regression.cjs && node tests/assignment-target-regression.cjs
      - run: node tests/plan-server-confirmation.cjs && node tests/stage4-plan-track.cjs
      - run: php tests/academic-transition.php
      # These integrations share the changed production router and app-state guards.
      - run: php tests/transition-history.php
      - run: npx tsc --noEmit
      - run: npm run build:hostinger
  native:
    if: github.head_ref == 'fix/stability-assignment-state'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test: ['assignment-state.php', 'transition-native.php']
        engine: ['mysql', 'mariadb']
        include:
          - engine: mysql
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1
          - engine: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: audit_test
          MYSQL_USER: audit
          MYSQL_PASSWORD: audit_only
          MYSQL_ROOT_PASSWORD: isolated_root_only
        ports: ['3307:3306']
        options: --health-cmd="${{ matrix.health }}" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pcntl
      - run: php tests/${{ matrix.test }}
        env:
          AUDIT_MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=audit_test;charset=utf8mb4
