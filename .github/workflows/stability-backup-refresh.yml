name: Refresh private production backup
on:
  pull_request:
permissions:
  contents: read
jobs:
  private-backup:
    if: github.head_ref == 'fix/stability-plan-history' && github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse the previously validated unchanged backup implementation
        run: git diff --exit-code f7cfad132558f1d26a2d40d6eae7d981c642593c -- scripts/create-private-db-backup.php scripts/create-private-db-backup.py
      - name: Create and validate private archive; no production record writes or deployment
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/create-private-db-backup.py
