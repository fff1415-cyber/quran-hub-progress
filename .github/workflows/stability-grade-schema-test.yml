name: Grade protocol schema on independent restore
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  test-restored-grade-schema:
    if: github.head_ref == 'ops/grade-schema-test' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5874f7230864787840b6c863155af589c9613189
          path: candidate
          persist-credentials: false
      - name: Verify additive and repeatable migration against the restored snapshot
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/test-grade-schema.py
