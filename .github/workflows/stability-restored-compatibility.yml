name: Check restored database compatibility
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify-index-on-test:
    if: github.head_ref == 'fix/stability-restored-compatibility' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: hostinger-independent-test-restoration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check additive evaluation index and verify all restored row values
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/test-restored-compatibility.py
