name: Transition profile acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  client-sqlite:
    if: github.head_ref == 'fix/stability-stage-4-transition-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - run: php tests/stage4-profile.php
      - run: npx tsc --noEmit
      - run: npm run build:hostinger
  native:
    if: github.head_ref == 'fix/stability-stage-4-transition-profile'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1
          - image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: audit_test
          MYSQL_USER: audit
          MYSQL_PASSWORD: audit_only
          MYSQL_ROOT_PASSWORD: isolated_root_only
        ports: ['3307:3306']
        options: --health-cmd="${{ matrix.health }}" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - run: php tests/stage4-native.php
        env:
          AUDIT_MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=audit_test;charset=utf8mb4
