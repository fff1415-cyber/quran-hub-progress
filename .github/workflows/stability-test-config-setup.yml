name: Prepare private test connection
on:
  pull_request:
permissions:
  contents: read
jobs:
  fixture:
    if: github.head_ref == 'fix/stability-test-config-setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - run: php scripts/tests/private-test-setup.php
      - run: python3 scripts/tests/private-terminal.py
  prepare-server:
    needs: fixture
    if: needs.fixture.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private file/helper and verify permissions; no record writes
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/prepare-private-test.py
      - name: Verify hidden synthetic input through an actual Hostinger SSH PTY
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/prepare-private-test.py --terminal-check
