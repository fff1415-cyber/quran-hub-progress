name: Verify independent Hostinger restoration
on:
  pull_request:
permissions:
  contents: read
jobs:
  fixture:
    if: github.head_ref == 'fix/stability-verified-restore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: isolated_root_only
          MARIADB_ROOT_HOST: '%'
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - run: sudo apt-get update -qq && sudo apt-get install -y mariadb-client
      - run: php scripts/tests/private-snapshot-restore.php
        env:
          QHP_RESTORE_FIXTURE: '1'
  restore-test:
    needs: fixture
    if: needs.fixture.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: hostinger-independent-test-restoration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify scoped grants, retain test snapshot, restore newest private archive, verify exact roundtrip
        env:
          DEPLOY_HOST: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_API_PATH: ${{ secrets.FTP_API_DIR }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/restore-hostinger-test.py
